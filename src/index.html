<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Hoteler Portal</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Hoteler后台管理系统." />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css?family=Roboto:400,400i,500,500i,700,700i"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
        <style>
            .hoteler-app-background {
                background: var(--mat-sys-surface);
            }

            .boot-loader {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: var(--mat-sys-surface, #f8f9ff);
                color: var(--mat-sys-on-surface, #191c20);
                font-family: Roboto, system-ui, sans-serif;
                text-align: center;
            }

            .boot-loader__logo {
                display: grid;
                place-items: center;
                width: 80px;
                height: 80px;
                margin-bottom: 24px;
                border-radius: 24px;
                background: var(--mat-sys-primary-container, #d8e2ff);
                color: var(--mat-sys-on-primary-container, #00458f);
            }

            .boot-loader__title {
                margin: 0;
                font-size: 30px;
                font-weight: 700;
                letter-spacing: -0.5px;
                line-height: 1.3;
            }

            .boot-loader__message {
                margin: 12px 0 28px;
                color: var(--mat-sys-on-surface-variant, #44474e);
                font-size: 14px;
                line-height: 1.6;
            }

            .boot-loader__spinner {
                width: 24px;
                height: 24px;
                border: 3px solid var(--mat-sys-primary-container, #d8e2ff);
                border-top-color: var(--mat-sys-primary, #005cbb);
                border-radius: 50%;
                animation: boot-loader-spin 0.9s linear infinite;
            }

            @keyframes boot-loader-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .boot-loader__spinner {
                    animation: none;
                }
            }
        </style>
    </head>

    <body class="hoteler-app-background mat-app-background">
        <noscript
            >Please enable JavaScript to continue using this
            application.</noscript
        >
        <app-root>
            <div
                class="boot-loader"
                role="status"
                aria-live="polite"
                lang="zh-CN"
            >
                <div class="boot-loader__logo" aria-hidden="true">
                    <svg
                        width="40"
                        height="40"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M3 18V6m18 12v-7a2 2 0 0 0-2-2h-7v6M3 15h18M3 18v2m18-2v2"
                        />
                        <circle cx="7.5" cy="10.5" r="2" />
                    </svg>
                </div>
                <p class="boot-loader__title">Hoteler</p>
                <p class="boot-loader__message">
                    正在准备您的工作空间，请稍候…
                </p>
                <span class="boot-loader__spinner" aria-hidden="true"></span>
            </div>
        </app-root>
    </body>
</html>
