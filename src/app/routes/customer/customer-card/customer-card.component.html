<mat-card appearance="outlined" class="customer-card-container" matRipple>
    <div class="card-header">
        <div class="avatar-container" [ngClass]="genderClass">
            <span class="avatar-initial">{{ nameInitial | uppercase }}</span>
        </div>
        <div class="header-details">
            <h3 class="customer-name">{{ customer.name }}</h3>
            <div class="gender-tag-wrapper">
                <app-tag [color]="genderTagColor">
                    <mat-icon class="gender-icon">{{
                        customer.gender === 'M'
                            ? 'male'
                            : customer.gender === 'F'
                              ? 'female'
                              : 'help_outline'
                    }}</mat-icon>
                    <span>{{ genderText }}</span>
                </app-tag>
            </div>
        </div>
    </div>

    <mat-card-content class="card-content">
        <div class="info-row">
            <mat-icon class="info-icon">phone</mat-icon>
            <div class="info-text">
                <span class="info-label">联系电话</span>
                <span class="info-value">{{ processPhone() }}</span>
            </div>
        </div>
        <div class="info-row">
            <mat-icon class="info-icon">badge</mat-icon>
            <div class="info-text">
                <span class="info-label">身份证号</span>
                <span class="info-value">{{ processCardId() }}</span>
            </div>
        </div>
    </mat-card-content>

    <mat-card-actions class="card-actions">
        <button mat-button class="btn-edit" (click)="onUpdate()">
            <mat-icon>edit</mat-icon>
            <span>修改</span>
        </button>
        <button mat-button color="warn" class="btn-delete" (click)="onDelete()">
            <mat-icon>delete_outline</mat-icon>
            <span>删除</span>
        </button>
    </mat-card-actions>
</mat-card>
