name: Release and Publish

on:
    workflow_dispatch:
        inputs:
            increment:
                description: Version increment
                required: true
                type: choice
                default: patch
                options:
                    - patch
                    - minor
                    - major
                    - prepatch
                    - preminor
                    - premajor
                    - prerelease
            preid:
                description: Prerelease identifier (ignored for stable releases)
                required: true
                type: choice
                default: beta
                options:
                    - alpha
                    - beta
                    - rc

permissions:
    contents: read

concurrency:
    group: release-and-publish
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.version.outputs.tag }}
        env:
            HUSKY: '0'
            CYPRESS_INSTALL_BINARY: '0'
        steps:
            - name: Require master branch
              env:
                  WORKFLOW_REF: ${{ github.ref }}
              run: |
                  if [[ "$WORKFLOW_REF" != 'refs/heads/master' ]]; then
                      echo '::error::Select master in the Run workflow branch selector.'
                      exit 1
                  fi

            - name: Checkout master
              uses: actions/checkout@v7.0.1
              with:
                  ref: master
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci --force

            - name: Prepare release version without creating a tag
              id: version
              env:
                  INCREMENT: ${{ inputs.increment }}
                  PREID: ${{ inputs.preid }}
              run: |
                  set -euo pipefail
                  case "$INCREMENT" in
                      patch|minor|major) ARGS=("$INCREMENT") ;;
                      prepatch|preminor|premajor|prerelease) ARGS=("$INCREMENT" --preid "$PREID") ;;
                      *) echo '::error::Unsupported version increment.'; exit 1 ;;
                  esac
                  case "$PREID" in
                      alpha|beta|rc) ;;
                      *) echo '::error::Unsupported prerelease identifier.'; exit 1 ;;
                  esac
                  # Skip the version lifecycle hook, which stages the changelog.
                  npm version "${ARGS[@]}" --no-git-tag-version --ignore-scripts
                  TAG="v$(node -p 'require("./package.json").version')"
                  if git show-ref --verify --quiet "refs/tags/$TAG"; then
                      echo "::error::Tag $TAG already exists."
                      exit 1
                  fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Validate release build before creating tag
              run: npm run test:ci

            - name: Generate changelog
              run: npm run changelog

            - name: Commit release and create tag
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add package.json package-lock.json CHANGELOG.md
                  git diff --cached --check
                  git commit -m "chore(release): $RELEASE_TAG"
                  git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
                  # Reject both updates if master moved or the tag already exists.
                  git push --atomic origin HEAD:refs/heads/master "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  set -euo pipefail
                  ARGS=("$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes)
                  if [[ "$RELEASE_TAG" == *-* ]]; then
                      ARGS+=(--prerelease)
                  fi
                  if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
                      gh release create "${ARGS[@]}"
                  fi

    publish-image:
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ needs.release.outputs.tag }}

            - name: Generate image tags
              id: image
              env:
                  REPOSITORY_OWNER: ${{ github.repository_owner }}
                  RELEASE_TAG: ${{ needs.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/hoteler-web"
                  SHA="$(git rev-parse HEAD)"
                  echo "sha=$SHA" >> "$GITHUB_OUTPUT"
                  {
                      echo 'tags<<EOF'
                      echo "$IMAGE:$RELEASE_TAG"
                      echo "$IMAGE:$SHA"
                      if [[ "$RELEASE_TAG" != *-* ]]; then
                          echo "$IMAGE:latest"
                      fi
                      echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ${{ steps.image.outputs.tags }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
                      org.opencontainers.image.version=${{ needs.release.outputs.tag }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
